<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAJOJU's Gaming Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-strong: #1f2937;
      --primary: #8b5cf6;
      --secondary: #38bdf8;
      --accent: #f59e0b;
      --text: #e5eefb;
      --muted: #bfd0ea;
      --line: rgba(148, 163, 184, 0.22);
      --shadow: rgba(15, 23, 42, 0.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(139, 92, 246, 0.28), transparent 32%),
        radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.22), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }

    .studio-shell {
      width: min(1100px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 22px 70px var(--shadow);
      padding: 32px 24px 28px;
      backdrop-filter: blur(8px);
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--secondary);
      font-size: 0.75rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 4vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
      margin-top: 18px;
    }

    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 260px;
      padding: 22px 20px 18px;
      border-radius: 24px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(135deg, rgba(31, 41, 55, 0.92), rgba(15, 23, 42, 0.92));
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, 0.75);
      box-shadow: 0 18px 35px rgba(139, 92, 246, 0.14);
    }

    .game-card.sos {
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.28), rgba(17, 24, 39, 0.96));
    }

    .game-card.xo {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.24), rgba(17, 24, 39, 0.96));
    }

    .badge {
      align-self: flex-start;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .game-card h2 {
      margin: 18px 0 10px;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: -0.05em;
    }

    .game-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.98rem;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: white;
      width: fit-content;
      min-width: 140px;
    }

    @media (max-width: 640px) {
      .studio-shell {
        padding: 22px 16px 18px;
        border-radius: 20px;
      }

      .game-card {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="studio-shell">
    <header class="hero">
      <p class="eyebrow">Game Arena</p>
      <h1>MAJOJU's Gaming Studio</h1>
      <p class="subtitle">Pick a game and jump in. More games will be added here soon.</p>
    </header>

    <main class="game-grid">
      <a class="game-card sos" href="sos.html">
        <span class="badge">Classic</span>
        <h2>SOS</h2>
        <p>Make sequences, claim boxes, and outsmart your opponent with smart line choices.</p>
        <span class="action">Play SOS</span>
      </a>

      <a class="game-card xo" href="xo.html">
        <span class="badge">Classic</span>
        <h2>XO</h2>
        <p>Take turns, complete a row, and win the match before your rival does.</p>
        <span class="action">Play XO</span>
      </a>
    </main>
  </div>
</body>
</html>
