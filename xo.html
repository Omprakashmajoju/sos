<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XO Game | MAJOJU's Gaming Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.76);
      --panel-strong: #1f2937;
      --primary-x: #f87171;
      --primary-o: #60a5fa;
      --surface: #111827;
      --surface-2: #1f2937;
      --text: #ecf3ff;
      --muted: #bfd0ea;
      --line: rgba(148, 163, 184, 0.2);
      --success: #34d399;
      --shadow: rgba(15, 23, 42, 0.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(248, 113, 113, 0.2), transparent 26%),
        radial-gradient(circle at bottom right, rgba(96, 165, 250, 0.24), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
    }

    .app {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 24px 20px 20px;
      box-shadow: 0 24px 70px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .home-link {
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
    }

    .status-label {
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-text {
      font-size: 1.12rem;
      font-weight: 800;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }

    .mode-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(96,165,250,0.22), rgba(139,92,246,0.28));
      border-color: rgba(96, 165, 250, 0.7);
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.18);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .cell {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: rgba(96, 165, 250, 0.7);
    }

    .cell.x { color: var(--primary-x); }
    .cell.o { color: var(--primary-o); }
    .cell.win {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.75);
      box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.45);
    }

    .cell:disabled {
      cursor: default;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    button:hover { filter: brightness(1.08); }

    .primary-btn {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
    }

    .secondary-btn {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .celebration-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      z-index: 20;
    }

    .celebration-modal.hidden {
      display: none;
    }

    .celebration-card {
      width: min(360px, calc(100vw - 32px));
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.26);
      border-radius: 22px;
      padding: 26px 20px 20px;
      text-align: center;
      box-shadow: 0 20px 64px rgba(15, 23, 42, 0.6);
    }

    .celebration-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .celebration-title {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: var(--success);
    }

    .celebration-subtitle {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .celebration-card .primary-btn {
      width: 100%;
      margin-top: 6px;
    }

    @media (max-width: 480px) {
      .app {
        padding: 18px 14px 16px;
        border-radius: 22px;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <a class="brand" href="index.html">MAJOJU's Gaming Studio</a>
      <a class="home-link" href="index.html">Home</a>
    </div>

    <div class="status-card">
      <span class="status-label">Turn</span>
      <span id="status-text" class="status-text">Player X</span>
    </div>

    <div class="mode-switch" aria-label="Game mode selector">
      <button class="mode-btn active" data-mode="pvp" type="button">Player vs Player</button>
      <button class="mode-btn" data-mode="ai" type="button">Player vs AI</button>
    </div>

    <div id="board" class="board" aria-label="Tic-Tac-Toe game board"></div>

    <div class="controls">
      <button class="primary-btn" id="restart-btn">New Round</button>
      <button class="secondary-btn" id="reset-btn">Reset Board</button>
    </div>
  </div>

  <div id="celebration-modal" class="celebration-modal hidden" aria-live="polite">
    <div class="celebration-card">
      <div class="celebration-icon">🎉</div>
      <h2 id="celebration-title" class="celebration-title">Player X Wins!</h2>
      <p id="celebration-subtitle" class="celebration-subtitle">Great play.</p>
      <button id="celebration-btn" class="primary-btn" type="button">Play Again</button>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const statusText = document.getElementById('status-text');
    const restartBtn = document.getElementById('restart-btn');
    const resetBtn = document.getElementById('reset-btn');
    const celebrationModal = document.getElementById('celebration-modal');
    const celebrationTitle = document.getElementById('celebration-title');
    const celebrationSubtitle = document.getElementById('celebration-subtitle');
    const celebrationBtn = document.getElementById('celebration-btn');
    const modeButtons = document.querySelectorAll('.mode-btn');

    const winningPatterns = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;
    let winningLine = [];
    let gameMode = 'pvp';
    let aiThinking = false;

    function showCelebration(title, subtitle) {
      celebrationTitle.textContent = title;
      celebrationSubtitle.textContent = subtitle;
      celebrationModal.classList.remove('hidden');
    }

    function hideCelebration() {
      celebrationModal.classList.add('hidden');
    }

    function createBoard() {
      boardEl.innerHTML = '';
      board.forEach((value, index) => {
        const cell = document.createElement('button');
        cell.className = 'cell';
        cell.type = 'button';
        cell.setAttribute('aria-label', `Cell ${index + 1}`);
        cell.textContent = value;
        cell.disabled = value !== '' || gameOver || (gameMode === 'ai' && currentPlayer === 'O' && aiThinking);
        if (value === 'X') cell.classList.add('x');
        if (value === 'O') cell.classList.add('o');
        if (winningLine.includes(index)) cell.classList.add('win');

        cell.addEventListener('click', () => handleMove(index));
        boardEl.appendChild(cell);
      });
    }

    function updateStatus(message) {
      statusText.textContent = message;
    }

    function getWinnerState(state = board) {
      for (const pattern of winningPatterns) {
        const [a, b, c] = pattern;
        if (state[a] && state[a] === state[b] && state[a] === state[c]) {
          return { winner: state[a], line: pattern };
        }
      }
      return null;
    }

    function finishTurn() {
      const result = getWinnerState();

      if (result) {
        winningLine = result.line;
        gameOver = true;
        const winnerName = result.winner === 'X' ? 'Player X' : (gameMode === 'ai' ? 'Computer' : 'Player O');
        updateStatus(`${winnerName} wins!`);
        showCelebration(`${winnerName} wins!`, 'A brilliant finish.');
        createBoard();
        return;
      }

      if (board.every(Boolean)) {
        gameOver = true;
        updateStatus("It's a draw!");
        showCelebration('Draw Game', 'No moves left on the board.');
        createBoard();
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus(gameMode === 'ai' && currentPlayer === 'O' ? 'Computer is thinking...' : `Player ${currentPlayer}`);
      createBoard();

      if (gameMode === 'ai' && currentPlayer === 'O' && !gameOver) {
        scheduleAiMove();
      }
    }

    function handleMove(index) {
      if (board[index] || gameOver) return;
      if (gameMode === 'ai' && currentPlayer === 'O') return;

      board[index] = currentPlayer;
      finishTurn();
    }

    function minimax(state, depth, isMaximizing) {
      const result = getWinnerState(state);
      if (result && result.winner === 'O') return 10 - depth;
      if (result && result.winner === 'X') return depth - 10;
      if (state.every(Boolean)) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < state.length; i++) {
          if (state[i]) continue;
          state[i] = 'O';
          const score = minimax(state, depth + 1, false);
          state[i] = '';
          bestScore = Math.max(bestScore, score);
        }
        return bestScore;
      }

      let bestScore = Infinity;
      for (let i = 0; i < state.length; i++) {
        if (state[i]) continue;
        state[i] = 'X';
        const score = minimax(state, depth + 1, true);
        state[i] = '';
        bestScore = Math.min(bestScore, score);
      }
      return bestScore;
    }

    function chooseAiMove() {
      let bestScore = -Infinity;
      let bestMove = null;

      for (let i = 0; i < board.length; i++) {
        if (board[i]) continue;

        board[i] = 'O';
        const score = minimax(board, 0, false);
        board[i] = '';

        if (score > bestScore) {
          bestScore = score;
          bestMove = i;
        }
      }

      return bestMove;
    }

    function scheduleAiMove() {
      if (gameMode !== 'ai' || gameOver || currentPlayer !== 'O') return;

      aiThinking = true;
      updateStatus('Computer is thinking...');
      createBoard();

      setTimeout(() => {
        if (gameOver) return;

        const move = chooseAiMove();
        aiThinking = false;

        if (move === null || board[move]) {
          return;
        }

        board[move] = 'O';
        finishTurn();
      }, 550);
    }

    function setGameMode(mode) {
      gameMode = mode;
      modeButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.mode === mode);
      });
      resetBoard();
    }

    function resetBoard() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      winningLine = [];
      aiThinking = false;
      hideCelebration();
      updateStatus(gameMode === 'ai' ? 'Player X' : 'Player X');
      createBoard();

      if (gameMode === 'ai') {
        updateStatus('Player X');
      }
    }

    restartBtn.addEventListener('click', resetBoard);
    resetBtn.addEventListener('click', resetBoard);
    celebrationBtn.addEventListener('click', resetBoard);
    modeButtons.forEach((button) => {
      button.addEventListener('click', () => setGameMode(button.dataset.mode));
    });

    resetBoard();
  </script>
</body>
</html>
